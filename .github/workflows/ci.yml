name: Verify and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install formatting tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and Python lint
        run: make lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [scalar, auto]
    steps:
      - uses: actions/checkout@v7
      - name: Install GMP development headers
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Verify frozen inputs
        run: make verify
      - name: Build and test
        run: make -j2 CPU=${{ matrix.cpu }} test
